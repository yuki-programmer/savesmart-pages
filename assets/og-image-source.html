<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; background: #f3f4f9; color: #1d2030; }
  .wrap { position: relative; width: 100%; height: 100%; padding: 56px 76px 46px; overflow: hidden; }
  .wrap::before { content: ""; position: absolute; width: 680px; height: 680px; right: -150px; top: -100px; border-radius: 50%; background: radial-gradient(circle, #dfe5f7, transparent 68%); }
  .brand { position: relative; display: flex; align-items: center; gap: 12px; font-size: 25px; font-weight: 800; }
  .brand img { width: 44px; height: 44px; border-radius: 13px; }
  .copy { position: relative; width: 650px; margin-top: 76px; }
  .eyebrow { display: block; color: #4e65ad; font-size: 17px; font-weight: 800; letter-spacing: .08em; margin-bottom: 18px; }
  h1 { margin: 0; font-size: 70px; line-height: 1.18; letter-spacing: -.055em; }
  h1 span { color: #4e65ad; }
  .lead { margin: 27px 0 0; font-size: 22px; line-height: 1.65; color: #687282; }
  .phone { position: absolute; top: 42px; right: 116px; width: 260px; aspect-ratio: 1170 / 2532; overflow: hidden; border-radius: 27px; background: white; box-shadow: 0 30px 64px -29px rgba(36, 43, 78, .45); }
  .phone img { display: block; width: 100%; height: auto; }
  .footer { position: absolute; left: 76px; bottom: 42px; font-size: 18px; font-weight: 700; color: #687282; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><img src="app-icon.png" alt="">SaveSmart</div>
    <div class="copy">
      <span class="eyebrow">今日のお金が、ひと目でわかる</span>
      <h1>今日は、<br><span>いくら使える？</span></h1>
      <p class="lead">今日使えるお金を毎朝表示。<br>支出を記録すると、明日以降の目安もわかる。</p>
    </div>
    <div class="phone"><img src="savesmart-home-20261023.jpeg" alt=""></div>
    <div class="footer">savesmartbudget.pages.dev</div>
  </div>
</body>
</html>
